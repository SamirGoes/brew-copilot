services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Volume nomeado: o SQLite sobrevive a recriar/atualizar o container.
      - brew-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      # O nginx resolve "backend" ao subir; espera o backend responder antes.
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  brew-data:
